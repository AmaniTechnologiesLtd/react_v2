name: Release

# Manually triggered from the Actions tab. Bumps package.json/package-lock.json,
# tags the release, and publishes a GitHub Release using the notes you type in.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New version number, without the "v" prefix (e.g. 0.3.0)'
        required: true
        type: string
      release_notes:
        description: 'Release notes for the GitHub Release'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        # Not --frozen-lockfile: the committed yarn.lock is in Yarn Berry's
        # format while CI runs Yarn Classic, so a strict lockfile match isn't
        # possible here today.
        run: yarn install

      - name: Smoke test
        run: yarn test:smoke

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        run: npm version "${{ inputs.version }}" --no-git-tag-version --allow-same-version

      - name: Commit version bump
        run: |
          git add package.json package-lock.json
          git commit -m "chore: release ${{ inputs.version }}"

      - name: Tag release
        run: git tag -a "v${{ inputs.version }}" -m "Release ${{ inputs.version }}"

      - name: Push commit and tag
        run: git push origin HEAD:main --follow-tags

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: Release ${{ inputs.version }}
          body: ${{ inputs.release_notes }}
